<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>ChargeCompare - Mise à jour</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.box{max-width:420px;text-align:center}.spin{width:46px;height:46px;border:5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;margin:0 auto 18px;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{font-size:24px}p{color:#c7ced9;line-height:1.45}</style></head><body><div class="box"><div class="spin"></div><h1>Mise à jour ChargeCompare</h1><p id="s">Suppression de l’ancienne version et du cache…</p></div><script>(async()=>{const s=document.getElementById('s');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}try{localStorage.setItem('chargecompare-cache-reset','12.3-'+Date.now())}catch{}s.textContent='Cache supprimé. Ouverture de la nouvelle version…';setTimeout(()=>location.replace('./?v=12.3&fresh='+Date.now()),500)}catch(e){s.textContent='Ouverture de la nouvelle version…';setTimeout(()=>location.replace('./?v=12.3&fresh='+Date.now()),700)}})();</script></body></html>
